name: Backend Deploy

# Publish the API and deploy it to Azure App Service.
#
# This runs ONLY after the "Backend CI" workflow completes successfully on
# `main` — `workflow_run` chains the two so the deploy is gated on build + test
# passing (the issue's "gate the deploy on backend CI success"). Backend CI is
# itself path-filtered to `backend/**`, so a push that doesn't touch the backend
# never starts this chain. We re-assert the success + branch conditions in the
# job `if` because `workflow_run` fires for every conclusion (success, failure,
# cancelled) and for any head branch.
#
# Auth uses OIDC federated credentials (azure/login) — no long-lived secret. The
# job requests an `id-token`, exchanges it for an Azure access token against a
# federated credential on the `anchor-deploy` app registration (subject
# `repo:<owner>/<repo>:environment:production`, matching this job's `environment`
# below), and webapps-deploy then deploys with that token. The SP holds only
# **Website Contributor** on the target App Service. This replaced the old
# AZURE_WEBAPP_PUBLISH_PROFILE secret, which could not work once SCM basic-auth
# publishing was disabled on the App Service (#274). The client/tenant/sub IDs
# and the App Service name come from repo Actions variables so a fork deploys to
# its own `anchor-api-<school>` resource with no source edits, mirroring the
# dashboard-deploy convention (#202); `scripts/setup.ps1` provisions them.
#
# Database migrations run HERE, before the new build goes live — not at app
# startup (#344). An EF Core migrations bundle is applied to the production
# database first; if it fails, the job stops before the deploy step and the
# running build keeps serving. No extra secret or role is needed: the bundle
# connects with the App Service's own `DefaultConnection` string, which the
# deploy identity can read through its Website Contributor role, and GitHub's
# Ubuntu runners run in Azure, so the SQL server's "Allow Azure services" rule
# (AllowAzureServices in infra/main.bicep) admits them.

on:
  workflow_run:
    workflows: ["Backend CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  id-token: write   # request the OIDC token for azure/login

# One deploy at a time, in order: two runs must never migrate the same database
# concurrently, and a newer commit must not be deployed under an older one.
concurrency:
  group: backend-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    # Only on a successful Backend CI run for main. workflow_run also fires on
    # failure/cancellation and (defensively) we pin the branch here too.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish
        run: >-
          dotnet publish src/Anchor.Api/Anchor.Api.csproj
          --configuration Release
          --output ${{ runner.temp }}/publish

      # dotnet-ef is pinned in backend/dotnet-tools.json; keep it on the same
      # version as the EF Core packages.
      - name: Build migrations bundle
        run: |
          dotnet tool restore
          dotnet ef migrations bundle \
            --project src/Anchor.Infrastructure/Anchor.Infrastructure.csproj \
            --startup-project src/Anchor.Api/Anchor.Api.csproj \
            --configuration Release \
            --output "$RUNNER_TEMP/efbundle" \
            --force

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # Applies pending migrations (none → no-op) before the deploy, so a
      # failure stops the job here and the running build is left untouched.
      - name: Apply database migrations
        env:
          WEBAPP_NAME: ${{ vars.AZURE_WEBAPP_NAME }}
        run: |
          set -euo pipefail
          # The deploy identity only sees this site, so look its resource
          # group up by name (as azure/webapps-deploy does).
          rg=$(az resource list --name "$WEBAPP_NAME" --resource-type Microsoft.Web/sites \
            --query "[0].resourceGroup" -o tsv)
          if [ -z "$rg" ]; then
            echo "::error::App Service '$WEBAPP_NAME' not found (check vars.AZURE_WEBAPP_NAME and the deploy identity's role)"
            exit 1
          fi
          conn=$(az webapp config connection-string list -g "$rg" -n "$WEBAPP_NAME" \
            --query "[?name=='DefaultConnection'].value | [0]" -o tsv)
          if [ -z "$conn" ]; then
            echo "::error::App Service '$WEBAPP_NAME' has no DefaultConnection connection string"
            exit 1
          fi
          # Escape workflow-command data so a '%' in the secret masks verbatim.
          mask() { local v=${1//%/%25}; v=${v//$'\r'/%0D}; echo "::add-mask::${v//$'\n'/%0A}"; }
          mask "$conn"
          password=$(printf '%s' "$conn" | sed -n 's/.*[Pp]assword=\([^;]*\).*/\1/p')
          if [ -n "$password" ]; then mask "$password"; fi
          "$RUNNER_TEMP/efbundle" --connection "$conn"

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          package: ${{ runner.temp }}/publish
