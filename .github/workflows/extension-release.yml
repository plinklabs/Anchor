name: Extension Release

# Build the Edge MV3 extension, package dist/ into a ZIP, and publish/update the
# single canonical Anchor listing on the Edge Add-ons store — triggered by an
# `extension-v*` tag (workstream C of the v1 release roadmap; #210).
#
# Trigger: a version tag, NOT a branch push. The release convention mirrors the
# agent's (agent-release.yml, #209): "bump `version` in extension/package.json
# (#208, the single source of truth), commit, then push a matching
# `extension-v<version>` tag" (see extension/README.md). The tag is the single
# thing that ships an extension build. pack-extension.mjs cross-checks the
# committed version against the tag and fails loudly on a mismatch.
#
# Backend-agnostic, one canonical listing: the extension gets its backend URL from
# the agent at runtime (#204), so every fork reuses the ONE published listing
# instead of publishing near-identical copies. Forks therefore normally do NOT run
# this workflow; it ships the canonical Plink Labs listing.
#
# Extension ID: the Edge store ASSIGNS the published ID and rejects a manifest that
# ships a `key`, so pack-extension.mjs strips `key` from the upload ZIP (locked by a
# test). The committed `key` (#123) only pins the ID for unpacked dev / self-hosted
# installs; it does NOT carry into the store-published ID. After the product is
# created, the agent-side pins must be re-set to the store-assigned ID — see
# extension/README.md "Post-publish: re-pin the store ID".
#
# Gate interaction: like agent-release.yml / backend-deploy.yml this workflow has
# NO `pull_request` trigger, so it never produces a check on a PR and must NOT be
# added to ci-gate.yml — a required/awaited check that never runs on a PR would
# hang the gate forever. A PR that only edits this file is validated by
# `actionlint` (and the pack-extension unit test asserts the same).
#
# Edge Add-ons submission: the publish step uses the Edge Add-ons (Partner Center)
# REST API. It runs ONLY when the submission secrets are configured (see
# extension/README.md "Publishing to the Edge Add-ons store"); otherwise the job
# still builds + packages + uploads the ZIP as a workflow artifact and prints the
# manual-submit instructions, so the API can be wired later without changing this
# file. No code-signing here — the Edge store re-signs on publish.
#
# Failing loudly (#336): a tag-triggered workflow produces no PR check, so a
# failed publish is visible only to someone who opens the Actions tab — 0.4.0 sat
# unpublished for ten weeks that way. Two additions close that:
#
#   * "Diagnose publish failure" turns the store's opaque error into an answer.
#     The two causes need opposite responses (wait out a review vs rotate
#     credentials) and look identical in the log, so a read-only probe decides
#     which one it was — see extension/scripts/diagnose-publish-failure.mjs.
#   * The `notify` job opens a GitHub issue naming the stranded tag. An issue
#     survives a holiday; a red dot in the Actions tab does not.
#
# The API key expiry check is advisory on purpose: keys last 72 days and cannot
# be renewed programmatically, so the run warns but never blocks — the ZIP is
# still worth producing for a manual upload.

on:
  push:
    tags:
      - 'extension-v*'

permissions:
  contents: read

concurrency:
  # Never run two submissions of the same tag concurrently against the store.
  group: extension-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Extension Edge Add-ons Release
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension
    # Surfaced to the `notify` job so the issue it files can name the actual
    # cause instead of just linking a red run.
    outputs:
      version: ${{ steps.ver.outputs.version }}
      cause: ${{ steps.diagnose.outputs.cause }}
      diagnosis: ${{ steps.diagnose.outputs.title }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: extension/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Derive the version from the tag (extension-v1.2.3 -> 1.2.3) and hand it to
      # the pack script, which cross-checks it against package.json and fails on
      # drift.
      - name: Resolve version from tag
        id: ver
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          case "$tag" in
            extension-v*) version="${tag#extension-v}" ;;
            *) echo "::error::Tag '$tag' is not of the form extension-v<version>."; exit 1 ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Release version: $version"

      # Build + zip dist/ into artifacts/anchor-extension-<version>.zip. The script
      # stamps the version into the packaged manifest and refuses to package a
      # build missing the pinned stable-ID `key`.
      - name: Build + package extension
        id: pack
        run: node scripts/pack-extension.mjs --version '${{ steps.ver.outputs.version }}'

      # Always keep the packaged ZIP as a workflow artifact — the exact bytes a
      # human can hand-upload to Partner Center if the API submission is skipped or
      # needs review before going live.
      - name: Upload extension package
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: anchor-extension-${{ steps.ver.outputs.version }}
          path: ${{ steps.pack.outputs.zip }}
          retention-days: 30

      # Submit to the Edge Add-ons store via the Partner Center API — only when the
      # submission secrets are present. A fork (or a not-yet-wired setup) skips this
      # cleanly and relies on the uploaded artifact + manual submit.
      - name: Check Edge Add-ons submission config
        id: cfg
        shell: bash
        env:
          PRODUCT_ID: ${{ vars.EDGE_ADDONS_PRODUCT_ID }}
          CLIENT_ID: ${{ secrets.EDGE_ADDONS_CLIENT_ID }}
          API_KEY: ${{ secrets.EDGE_ADDONS_API_KEY }}
        run: |
          if [ -n "$PRODUCT_ID" ] && [ -n "$CLIENT_ID" ] && [ -n "$API_KEY" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Edge Add-ons submission secrets not set — skipping API submit. Download the 'anchor-extension-${{ steps.ver.outputs.version }}' artifact and upload it manually at https://partner.microsoft.com/dashboard/microsoftedge (see extension/README.md)."
          fi

      # Advisory, never a gate: Edge Add-ons API keys expire 72 days after they
      # are created, don't renew on use, and can't be rotated programmatically.
      # Cutting a tag on a nearly-dead key should say so before the publish, not
      # after it 403s. `EDGE_ADDONS_KEY_ROTATED` is the date the credentials were
      # last created in Partner Center.
      - name: Check Edge Add-ons API key expiry
        if: ${{ steps.cfg.outputs.configured == 'true' }}
        env:
          KEY_ROTATED: ${{ vars.EDGE_ADDONS_KEY_ROTATED }}
        run: node scripts/check-key-expiry.mjs

      - name: Publish to Edge Add-ons store
        id: publish
        if: ${{ steps.cfg.outputs.configured == 'true' }}
        uses: wdzeng/edge-addon@v2
        with:
          product-id: ${{ vars.EDGE_ADDONS_PRODUCT_ID }}
          zip-path: ${{ steps.pack.outputs.zip }}
          client-id: ${{ secrets.EDGE_ADDONS_CLIENT_ID }}
          api-key: ${{ secrets.EDGE_ADDONS_API_KEY }}

      # The store returns the same shape of error whether a prior submission is
      # still in review or the credentials are dead, and the two need opposite
      # responses. One read-only probe settles it — see the script for why the
      # probe is safe (it resolves a deliberately non-existent operation id, so
      # it uploads nothing and changes no submission).
      - name: Diagnose publish failure
        id: diagnose
        if: ${{ failure() && steps.publish.outcome == 'failure' }}
        env:
          PRODUCT_ID: ${{ vars.EDGE_ADDONS_PRODUCT_ID }}
          CLIENT_ID: ${{ secrets.EDGE_ADDONS_CLIENT_ID }}
          API_KEY: ${{ secrets.EDGE_ADDONS_API_KEY }}
          RELEASE_VERSION: ${{ steps.ver.outputs.version }}
          RUN_ID: ${{ github.run_id }}
        run: node scripts/diagnose-publish-failure.mjs

  # A tag-triggered workflow shows up nowhere except the Actions tab, so a failed
  # release is silent by construction. File an issue instead — and update the
  # existing one on a re-run rather than stacking duplicates.
  notify:
    name: Report a failed release
    needs: release
    if: ${{ failure() }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open or update the release-failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          CAUSE: ${{ needs.release.outputs.cause }}
          DIAGNOSIS: ${{ needs.release.outputs.diagnosis }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          title="Release $TAG failed to publish"

          if [ -n "${DIAGNOSIS:-}" ]; then
            summary="**Diagnosis (\`$CAUSE\`):** $DIAGNOSIS"$'\n\n'"The run log carries the exact recovery steps."
          else
            summary="The run failed before the publish step could be diagnosed — check the log."
          fi

          body="\`$TAG\` was tagged but is **not on the Edge Add-ons store**.

          $summary

          Run: $RUN_URL

          The packaged ZIP is attached to that run as an artifact, so recovery
          never needs a re-tag: fix the cause and re-run the failed job with
          \`gh run rerun ${{ github.run_id }} --failed\`. If newer work has landed
          by then, bump the version and cut a fresh tag instead.

          _Filed automatically by extension-release.yml (#336)._"

          existing=$(gh issue list --state open --search "$title in:title" \
            --json number,title --jq "map(select(.title == \"$title\")) | .[0].number // empty")

          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "Still failing — $RUN_URL"
            echo "::notice::Updated existing issue #$existing for $TAG."
          else
            url=$(gh issue create --title "$title" --label blocked --body "$body")
            echo "::notice::Filed $url for the stranded $TAG release."
          fi
