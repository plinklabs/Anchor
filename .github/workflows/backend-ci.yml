name: Backend CI

# contracts/**: the session hub contract (#390). SessionHubContractTests checks
# the backend against it, and Dashboard CI / Deploy checks the dashboard.
on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'contracts/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    paths:
      - 'backend/**'
      - 'contracts/**'
      - '.github/workflows/backend-ci.yml'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Anchor.sln

      - name: Build
        run: dotnet build Anchor.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test Anchor.sln --configuration Release --no-build --verbosity normal

      # backend-deploy.yml applies migrations with this bundle (#344). Building
      # it here catches a broken bundle (e.g. dotnet-ef out of step with the EF
      # Core packages) on the PR instead of in the deploy after merge.
      - name: Build migrations bundle
        run: |
          dotnet tool restore
          dotnet ef migrations bundle \
            --project src/Anchor.Infrastructure/Anchor.Infrastructure.csproj \
            --startup-project src/Anchor.Api/Anchor.Api.csproj \
            --configuration Release \
            --output "$RUNNER_TEMP/efbundle" \
            --force
