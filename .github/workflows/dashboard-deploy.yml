name: Dashboard CI / Deploy

# contracts/**: the session hub (#390) and REST (#393) contracts. The tests in
# test/contract/ check the dashboard against them, and Backend CI checks the
# backend. A change to them alone also redeploys the (unchanged) dashboard
# from main.
#
# Manual run (#401): `gh workflow run dashboard-deploy.yml --ref main`. Use it
# after setting or rotating AZURE_STATIC_WEB_APPS_API_TOKEN. Re-running an old
# run does not help: a re-run keeps the secrets the run was created with
# (cli/cli#13522), so a deploy that failed on a bad token fails again however
# often it is re-run. A manual run refuses any ref but main, so it cannot
# publish unreleased work (the repo's default branch is develop).
on:
  push:
    branches: [main]
    paths:
      - 'dashboard/**'
      - 'contracts/**'
      - '.github/workflows/dashboard-deploy.yml'
  pull_request:
    paths:
      - 'dashboard/**'
      - 'contracts/**'
      - '.github/workflows/dashboard-deploy.yml'
  workflow_dispatch:

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - name: Refuse a manual run on a ref other than main
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
        # The job's default working directory (dashboard/) does not exist
        # before checkout.
        working-directory: ${{ github.workspace }}
        run: |
          echo "::error::The dashboard deploys main only; dispatch with --ref main (got ${GITHUB_REF})."
          exit 1

      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.0'

      - name: Install dependencies
        run: flutter pub get

      # Pinned to the same flutter-version above, so the bundled `dart format`
      # matches the formatter the tree is committed with (Dart 3.12.0). Keeps
      # local == CI deterministic and blocks unformatted code from landing (#310).
      - name: Format check
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      # dart-defines source the release tenant/backend from repo Actions
      # variables so a fork targets its own Entra app + API with no source
      # edits (#202). Each falls back to the dev default baked into
      # lib/main.dart / lib/auth/msal_config.dart when the variable is unset,
      # so contributors building locally are unaffected. These are public
      # SPA client config (not secrets), hence vars.* rather than secrets.*.
      - name: Build web
        run: |
          flutter build web --release \
            ${{ vars.API_BASE_URL && format('--dart-define=API_BASE_URL={0}', vars.API_BASE_URL) || '' }} \
            ${{ vars.ENTRA_TENANT_ID && format('--dart-define=ENTRA_TENANT_ID={0}', vars.ENTRA_TENANT_ID) || '' }} \
            ${{ vars.ENTRA_CLIENT_ID && format('--dart-define=ENTRA_CLIENT_ID={0}', vars.ENTRA_CLIENT_ID) || '' }} \
            ${{ vars.API_SCOPE && format('--dart-define=API_SCOPE={0}', vars.API_SCOPE) || '' }}

      - name: Deploy to Azure Static Web Apps
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: dashboard/build/web
          skip_app_build: true
