name: Dashboard E2E

# Paths: the dashboard and this file only, on purpose (#368). The suite never
# builds or calls the backend (see the job's comment), so its result depends on
# dashboard/** alone and a backend-only change can't change it. Backend paths
# would rerun the same result at three 4-minute shards a PR, and a green run
# would look like proof that the dashboard still fits the backend. It isn't.
# A backend change to what the dashboard receives or calls needs a contract
# test both sides run instead: contracts/session-hub.json pins the hub's events,
# their routing and payloads, which Backend CI and Dashboard CI / Deploy both
# test (#390). REST DTOs aren't pinned yet (#393).
on:
  push:
    branches: [main]
    paths:
      - 'dashboard/**'
      - '.github/workflows/dashboard-e2e.yml'
  pull_request:
    paths:
      - 'dashboard/**'
      - '.github/workflows/dashboard-e2e.yml'

concurrency:
  group: dashboard-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    # Linux runner: the dashboard is Flutter Web, and the GitHub-hosted ubuntu
    # image ships Google Chrome + a matching chromedriver (under $CHROMEWEBDRIVER),
    # which is all `flutter drive` needs for a real-browser run. No backend: the
    # dashboard is MSAL-only and can't be dev-impersonated, so the suite boots the
    # real app against fake APIs + a stubbed SignalR feed (#132).
    #
    # Every integration_test/**/*_test.dart file runs, found by name, so a new
    # one runs without being added here (#376). Each file says in its own header
    # what it drives. No file needs its own flags: the Dutch locale
    # (dutch_locale_test.dart) and the window size
    # (integration_test/support/e2e_binding.dart) are set in test code, so one
    # `flutter drive` command fits every file.
    #
    # The files are split across parallel shards by their place in the sorted
    # list. One `flutter drive` takes about 30 s, so all 18 files in one job
    # would take about 10 minutes, longer than any other check; three shards
    # take about 4. Add a number to `shard` to add a shard. The CI Gate waits
    # for every job named "Dashboard E2E (n/total)".
    name: Dashboard E2E (${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.0'

      - name: Install dependencies
        run: flutter pub get

      # Drives each of this shard's files in headless Chrome. A failing file
      # doesn't stop the rest: each one runs, the log names every failure (an
      # error annotation plus the job summary), and the step fails at the end.
      # `timeout` bounds a file that hangs. chromedriver is started once for
      # the shard and every `flutter drive` reuses it.
      - name: Run e2e files (web, headless Chrome)
        env:
          SHARD_INDEX: ${{ strategy.job-index }}
          SHARD_TOTAL: ${{ strategy.job-total }}
        run: |
          mapfile -t all < <(find integration_test -type f -name '*_test.dart' | LC_ALL=C sort)
          if [ "${#all[@]}" -eq 0 ]; then
            echo "::error::No integration_test/**/*_test.dart files found."
            exit 1
          fi
          files=()
          for i in "${!all[@]}"; do
            if [ $(( i % SHARD_TOTAL )) -eq "$SHARD_INDEX" ]; then
              files+=("${all[$i]}")
            fi
          done
          echo "Shard $(( SHARD_INDEX + 1 ))/$SHARD_TOTAL runs ${#files[@]} of ${#all[@]} files:"
          printf '  %s\n' "${files[@]}"

          "$CHROMEWEBDRIVER/chromedriver" --port=4444 &

          {
            echo "### Dashboard E2E shard $(( SHARD_INDEX + 1 ))/$SHARD_TOTAL"
            echo
            echo "| File | Result | Time |"
            echo "| --- | --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"
          failed=()
          for file in "${files[@]}"; do
            echo "::group::$file"
            start=$SECONDS
            if timeout --kill-after=30s 10m flutter drive \
                --driver=test_driver/integration_test.dart \
                --target="$file" \
                -d web-server \
                --browser-name=chrome \
                --headless; then
              result=passed
            else
              code=$?
              result="FAILED (exit $code)"
              if [ "$code" -eq 124 ]; then result="FAILED (timed out after 10 min)"; fi
              failed+=("$file")
            fi
            echo "::endgroup::"
            if [ "$result" != passed ]; then
              echo "::error file=dashboard/$file,title=Dashboard E2E::$file $result"
            fi
            echo "| \`$file\` | $result | $(( SECONDS - start )) s |" >> "$GITHUB_STEP_SUMMARY"
          done

          if [ "${#failed[@]}" -gt 0 ]; then
            echo "${#failed[@]} of ${#files[@]} files failed:"
            printf '  %s\n' "${failed[@]}"
            exit 1
          fi
          echo "All ${#files[@]} files passed."
