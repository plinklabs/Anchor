name: Extension E2E

# The harness runs the extension against the real native-messaging host
# (agent/src/FocusAgent.WitnessHost, which builds against FocusAgent.Core) and a
# stand-in for the agent; no backend (#489). So those are the paths it watches.
on:
  push:
    branches: [main]
    paths:
      - 'extension/**'
      - 'agent/src/FocusAgent.WitnessHost/**'
      - 'agent/src/FocusAgent.Core/**'
      - '.github/workflows/extension-e2e.yml'
  pull_request:
    paths:
      - 'extension/**'
      - 'agent/src/FocusAgent.WitnessHost/**'
      - 'agent/src/FocusAgent.Core/**'
      - '.github/workflows/extension-e2e.yml'

concurrency:
  group: extension-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Extension E2E
    # Windows runner: Edge is preinstalled (so `channel: 'msedge'` needs no
    # browser download), it has a desktop session for the headed browser an MV3
    # extension load requires, and native messaging needs its HKCU host
    # registration. The harness builds the witness host itself (dotnet build).
    runs-on: windows-latest
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: extension/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Warm the witness host build once, so the first spec isn't spent on a
      # cold restore+build when the harness registers the host.
      - name: Build witness host
        working-directory: agent
        run: dotnet build src/FocusAgent.WitnessHost/FocusAgent.WitnessHost.csproj --configuration Debug

      - name: Run e2e suite
        run: npm run e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: extension/playwright-report/
          retention-days: 7
