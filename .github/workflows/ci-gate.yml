name: CI Gate

# Single always-present status check that stands in for the path-filtered CI
# workflows. Each of those (backend-ci, agent-e2e, dashboard-e2e,
# dashboard-deploy, extension-e2e, infra-ci, scripts-ci) only runs when a PR
# touches its paths, so none of them can be a GitHub *required* status check on
# its own: a required check that doesn't run is reported "pending" forever and
# blocks the PR permanently.
#
# This gate runs on EVERY pull request (no path filter), so it always reports.
# It detects which areas the PR changed (mirroring each workflow's exact PR path
# filters) and waits ONLY for the suites those changes actually trigger, failing
# if any of them did not succeed. A PR that touches no gated area passes the gate
# immediately. Mark *this* check (CI Gate / gate) as the required status check on
# main and develop.
#
# Keep the filters below in lock-step with the `on.pull_request.paths` of each
# referenced workflow — if a workflow's filter changes, change the matching
# filter here too, or the gate will wait for a check that never runs. The step
# "Check the filters match their workflows" enforces this (#368): each filter
# must list its workflow's own file and be identical to that workflow's
# pull_request paths, and every workflow with pull_request paths needs a filter.

on:
  pull_request:

permissions:
  checks: read
  contents: read
  pull-requests: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Fails the gate when a filter below has drifted from its workflow's
      # paths (see the header). Run the same command from the repo root to
      # check locally.
      - name: Check the filters match their workflows
        run: python3 .github/scripts/check-gate-filters.py

      - name: Detect changed areas
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'contracts/**'
              - '.github/workflows/backend-ci.yml'
            agent:
              - 'agent/**'
              - 'backend/**'
              - '.github/workflows/agent-e2e.yml'
            dashboard_e2e:
              - 'dashboard/**'
              - '.github/workflows/dashboard-e2e.yml'
            dashboard_deploy:
              - 'dashboard/**'
              - 'contracts/**'
              - '.github/workflows/dashboard-deploy.yml'
            extension:
              - 'extension/**'
              - 'backend/**'
              - '.github/workflows/extension-e2e.yml'
            infra:
              - 'infra/**'
              - 'scripts/setup.ps1'
              - '.github/workflows/infra-ci.yml'
            scripts:
              - 'scripts/**'
              - 'agent/scripts/**'
              - '**/*.ps1'
              - '**/*.psm1'
              - '**/*.psd1'
              - '.github/workflows/scripts-ci.yml'

      # Each wait targets a suite's check by its (now unique) job name and only
      # runs when that suite's paths changed — exactly when the suite itself runs.
      - name: Wait for Backend CI
        if: steps.changes.outputs.backend == 'true'
        uses: lewagon/wait-on-check-action@v1.8.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          check-name: build-and-test
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          wait-interval: 20
          allowed-conclusions: success

      - name: Wait for Agent E2E
        if: steps.changes.outputs.agent == 'true'
        uses: lewagon/wait-on-check-action@v1.8.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          check-name: Agent E2E
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          wait-interval: 20
          allowed-conclusions: success

      # Dashboard E2E runs as parallel shards, one check each, named
      # "Dashboard E2E (1/3)" and so on (#376), so this waits for all of them.
      - name: Wait for Dashboard E2E
        if: steps.changes.outputs.dashboard_e2e == 'true'
        uses: lewagon/wait-on-check-action@v1.8.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          check-regexp: '^Dashboard E2E \(\d+/\d+\)$'
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          wait-interval: 20
          allowed-conclusions: success

      - name: Wait for Dashboard CI / Deploy
        if: steps.changes.outputs.dashboard_deploy == 'true'
        uses: lewagon/wait-on-check-action@v1.8.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          check-name: build_and_deploy
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          wait-interval: 20
          allowed-conclusions: success

      - name: Wait for Extension E2E
        if: steps.changes.outputs.extension == 'true'
        uses: lewagon/wait-on-check-action@v1.8.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          check-name: Extension E2E
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          wait-interval: 20
          allowed-conclusions: success

      - name: Wait for Infra CI
        if: steps.changes.outputs.infra == 'true'
        uses: lewagon/wait-on-check-action@v1.8.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          check-name: build-and-lint
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          wait-interval: 20
          allowed-conclusions: success

      - name: Wait for Scripts CI
        if: steps.changes.outputs.scripts == 'true'
        uses: lewagon/wait-on-check-action@v1.8.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          check-name: check-scripts
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          wait-interval: 20
          allowed-conclusions: success

      - name: Gate summary
        run: |
          echo "Changed areas:"
          echo "  backend=${{ steps.changes.outputs.backend }}"
          echo "  agent=${{ steps.changes.outputs.agent }}"
          echo "  dashboard_e2e=${{ steps.changes.outputs.dashboard_e2e }}"
          echo "  dashboard_deploy=${{ steps.changes.outputs.dashboard_deploy }}"
          echo "  extension=${{ steps.changes.outputs.extension }}"
          echo "  infra=${{ steps.changes.outputs.infra }}"
          echo "  scripts=${{ steps.changes.outputs.scripts }}"
          echo "All triggered suites passed (or none were triggered)."
